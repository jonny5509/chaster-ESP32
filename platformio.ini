[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.0.4

[env:esp32dev]
platform = espressif32
board = esp32dev

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1

[env:esp32s2]
platform = espressif32
board = esp32-s2-saola-1

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
