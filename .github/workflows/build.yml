name: PlatformIO build

on:
  push:
    branches: [main, wearer-keyholder-handover]
  pull_request:
    branches: [main, wearer-keyholder-handover]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [esp32dev, esp32c3, esp32s2, esp32s3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}
